<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gemini Order Capture</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel input-panel">
        <div class="panel-header">
          <div>
            <h1>Order Review</h1>
            <p id="status">Checking backend...</p>
          </div>
          <button id="sampleButton" type="button">Load sample</button>
        </div>

        <form id="extractForm">
          <label>
            Customer
            <select name="customer_code">
              <option value="CUST-DEMO">CUST-DEMO</option>
              <option value="CUST-PIZZA">CUST-PIZZA</option>
              <option value="CUST-CATERING">CUST-CATERING</option>
            </select>
          </label>

          <label>
            Order text
            <textarea
              name="text"
              rows="8"
              placeholder="Paste OCR text or a quick manual order here"
            ></textarea>
          </label>

          <label>
            File
            <input name="file" type="file" accept="image/*,application/pdf" />
          </label>
          <!-- Audio input is an optional extension — see project brief for details. -->
          <p class="field-note">Audio input is an optional extension — see project brief for details.</p>

          <div class="actions">
            <button type="submit" class="primary">Extract order</button>
            <button id="clearButton" type="button">Clear</button>
          </div>
        </form>
      </section>

      <section class="panel output-panel">
        <div class="panel-header">
          <div>
            <h2>Candidate JSON</h2>
            <p>Review before finalizing.</p>
          </div>
          <button id="feedbackButton" type="button" disabled>Send feedback</button>
        </div>

        <div id="summary" class="summary empty">No extraction yet.</div>
        <div id="items"></div>
        <pre id="jsonOutput">{}</pre>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
